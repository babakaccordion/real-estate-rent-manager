services:
  - type: web
    name: real-estate-rent-manager
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render يولد مفتاحاً سرياً قوياً تلقائياً
      - key: SECRET_KEY
        generateValue: true
      # ضع هنا رابط قاعدة بيانات PostgreSQL (Neon أو Supabase أو Render)
      # مثال: postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # اختياري: بيانات المدير الأولية (تُستخدم فقط عند أول إنشاء للمستخدم).
      # إن حُذفت فستُنشأ بيانات الدخول من شاشة الإعداد الأولى.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
