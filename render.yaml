services:
  - type: web
    name: real-estate-rent-manager
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render يولد مفتاحاً سرياً قوياً تلقائياً
      - key: SECRET_KEY
        generateValue: true
      # ضع هنا رابط قاعدة بيانات PostgreSQL (Neon أو Supabase أو Render)
      # مثال: postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # كلمة مرور المدير الأولية (تُستخدم فقط عند إنشاء المستخدم أول مرة)
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
